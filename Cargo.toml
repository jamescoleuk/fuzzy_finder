[package]
authors = ["James Cole <jamescole.uk@gmail.com>"]
categories = ["command-line-interface", "command-line-utilities"]
description = "A fuzzy finding UI for CLI applications written in Rust"
edition = "2024"
rust-version = "1.86"
keywords = ["bash", "cli"]
license = "MIT OR Apache-2.0"
name = "fuzzy_finder"
repository = "https://github.com/jamescoleuk/fuzzy_finder"
version = "0.5.0"

[dependencies]
crossterm = "0.29"
fuzzy-matcher = "0.3"
log = "0.4"
pastel_colours = "0.2"
thiserror = "2"

# Dependencies for the LotR example
[dev-dependencies]
anyhow = "1.0"
csv = "1"
serde = { version = "1.0", features = ["derive"] }
simplelog = "0.12"
